name: CI/CD DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Seguranca (Gitleaks + Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (segredos)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep (SAST)
        run: |
          pip install --quiet semgrep
          semgrep --error --metrics=off \
            --config=p/javascript \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/dockerfile \
            app/

  build:
    name: Build + Trivy
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t guiding-hand-cloud:${{ github.sha }} ./app

      - name: Trivy (vulnerabilidades da imagem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: guiding-hand-cloud:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  deploy:
    name: Deploy na AWS EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/guiding-hand
            git pull --ff-only
            docker compose up -d --build
            docker image prune -f
