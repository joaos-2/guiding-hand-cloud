name: CI/CD DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Seguranca (Gitleaks + Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (segredos)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep (SAST)
        run: |
          pip install --quiet semgrep
          semgrep --error --metrics=off \
            --config=p/javascript \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/dockerfile \
            app/

  build:
    name: Build + Trivy
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t guiding-hand-cloud:${{ github.sha }} ./app

      - name: Trivy (vulnerabilidades da imagem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: guiding-hand-cloud:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  deploy:
    name: Deploy automatico (pull-based) + verificacao
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - name: Aguarda a EC2 puxar o main e confere a versao no ar
        run: |
          SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "Versao esperada no ar: $SHORT"
          for i in $(seq 1 40); do
            got=$(curl -s --max-time 5 "http://${{ secrets.EC2_HOST }}/version" | sed -n 's/.*"sha":"\([^"]*\)".*/\1/p' || true)
            echo "tentativa $i: versao na EC2 = '$got'"
            if [ "$got" = "$SHORT" ]; then echo "Deploy confirmado na EC2 (versao $SHORT no ar)"; exit 0; fi
            sleep 15
          done
          echo "Timeout: a versao $SHORT nao apareceu na EC2"; exit 1
